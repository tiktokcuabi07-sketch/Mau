<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chúc Mừng 8/3 - Quà Tặng Từ [Tên bạn]</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      overflow: hidden;
      color: white;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      position: relative;
      z-index: 10;
    }
    h1 {
      font-size: 4rem;
      margin: 0;
      text-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
      animation: pulse 2s infinite;
    }
    p {
      font-size: 1.8rem;
      margin: 20px 0;
    }
    .heart {
      color: #ff4757;
      font-size: 5rem;
      animation: beat 1.2s infinite;
      display: block;
      margin: 20px auto;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    @keyframes beat {
      0% { transform: scale(1); }
      30% { transform: scale(1.3); }
      60% { transform: scale(1); }
      100% { transform: scale(1); }
    }
    .hearts {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }
    .heart-float {
      position: absolute;
      font-size: 2rem;
      animation: float 8s linear infinite;
      opacity: 0.8;
    }
    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0.4; }
      100% { transform: translateY(-20vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>
  
  <div class="container">
    <div class="heart">❤️</div>
    <h1>Chúc Mừng 8/3</h1>
    <p>Chúc [Tên người nhận] luôn xinh đẹp, vui vẻ, hạnh phúc và được yêu thương thật nhiều nhé! 🌸💐</p>
    <p>Từ [Tên bạn] – người luôn trân trọng em/mẹ/bạn nhất ❤️</p>
  </div>

  <script>
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart-float";
      heart.innerHTML = ["❤️", "💖", "💕", "🌸", "✨"][Math.floor(Math.random()*5)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 5 + 6) + "s";
      heart.style.fontSize = (Math.random() * 1.5 + 1.2) + "rem";
      document.getElementById("hearts").appendChild(heart);
      
      setTimeout(() => heart.remove(), 10000);
    }
    
    setInterval(createHeart, 400);
  </script>
</body>
</html>
